<svg xmlns="http://www.w3.org/2000/svg" width="880" height="200" viewBox="0 0 880 200">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>
    <linearGradient id="indigoPurple" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="metricGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.02"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="880" height="200" fill="url(#bg)"/>

  <!-- Subtle grid -->
  <g opacity="0.06" stroke="#6366f1" stroke-width="0.5">
    <line x1="0" y1="50" x2="880" y2="50"/>
    <line x1="0" y1="100" x2="880" y2="100"/>
    <line x1="0" y1="150" x2="880" y2="150"/>
    <line x1="220" y1="0" x2="220" y2="200"/>
    <line x1="440" y1="0" x2="440" y2="200"/>
    <line x1="660" y1="0" x2="660" y2="200"/>
  </g>

  <!-- === LEFT PANEL: Kubernetes Cluster Mesh & GitOps Topology (x: 10-290) === -->
  <g transform="translate(10,15)">
    <text x="10" y="12" font-family="monospace" font-size="8" fill="#6366f1" opacity="0.7">k8s_mesh · gitops_sync</text>
    <!-- Ingress / Control Plane nodes -->
    <g filter="url(#softglow)">
      <!-- API Gateway / Ingress -->
      <circle cx="35" cy="45" r="5" fill="none" stroke="#6366f1" stroke-width="1.5">
        <animate attributeName="r" values="3;7;3" dur="2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="47" font-family="monospace" font-size="6" fill="#8b5cf6" opacity="0.6">ingress</text>

      <!-- GitOps / ArgoCD Controller -->
      <circle cx="35" cy="90" r="5" fill="none" stroke="#8b5cf6" stroke-width="1.5">
        <animate attributeName="r" values="3;7;3" dur="2s" begin="0.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.4s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="92" font-family="monospace" font-size="6" fill="#6366f1" opacity="0.6">argocd</text>

      <!-- Control Plane / Kube-API -->
      <circle cx="35" cy="135" r="5" fill="none" stroke="#6366f1" stroke-width="1.5">
        <animate attributeName="r" values="3;7;3" dur="2s" begin="0.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.8s" repeatCount="indefinite"/>
      </circle>
      <text x="44" y="137" font-family="monospace" font-size="6" fill="#8b5cf6" opacity="0.6">kube-api</text>

      <!-- Worker Node Pods -->
      <circle cx="120" cy="55" r="5" fill="none" stroke="#8b5cf6" stroke-width="1.5">
        <animate attributeName="r" values="3;7;3" dur="2s" begin="0.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.2s" repeatCount="indefinite"/>
      </circle>
      <text x="128" y="57" font-family="monospace" font-size="6" fill="#6366f1" opacity="0.6">pod-app</text>

      <circle cx="120" cy="115" r="5" fill="none" stroke="#6366f1" stroke-width="1.5">
        <animate attributeName="r" values="3;7;3" dur="2s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.5;1;0.5" dur="2s" begin="0.6s" repeatCount="indefinite"/>
      </circle>
      <text x="128" y="117" font-family="monospace" font-size="6" fill="#8b5cf6" opacity="0.6">pod-api</text>

      <!-- ClickHouse / Data store cluster target -->
      <circle cx="205" cy="85" r="6" fill="none" stroke="url(#indigoPurple)" stroke-width="2">
        <animate attributeName="r" values="4;9;4" dur="2s" begin="1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" begin="1s" repeatCount="indefinite"/>
      </circle>
      <text x="216" y="87" font-family="monospace" font-size="6.5" fill="#8b5cf6" opacity="0.8">clickhouse</text>
    </g>

    <!-- Mesh lines connecting topology -->
    <g stroke="#6366f1" stroke-width="0.8" opacity="0.35" fill="none">
      <line x1="35" y1="45" x2="120" y2="55"/>
      <line x1="35" y1="45" x2="120" y2="115"/>
      <line x1="35" y1="90" x2="120" y2="55"/>
      <line x1="35" y1="90" x2="120" y2="115"/>
      <line x1="35" y1="135" x2="120" y2="55"/>
      <line x1="35" y1="135" x2="120" y2="115"/>
      <line x1="120" y1="55" x2="205" y2="85"/>
      <line x1="120" y1="115" x2="205" y2="85"/>
    </g>

    <!-- Traveling traffic packet pulses -->
    <circle r="2.5" fill="#8b5cf6" filter="url(#glow)">
      <animateMotion path="M35,45 L120,55" dur="1.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#6366f1" filter="url(#glow)">
      <animateMotion path="M35,90 L120,115" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.5s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#8b5cf6" filter="url(#glow)">
      <animateMotion path="M120,55 L205,85" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="0.7s" repeatCount="indefinite"/>
    </circle>
    <circle r="2.5" fill="#6366f1" filter="url(#glow)">
      <animateMotion path="M120,115 L205,85" dur="1.5s" begin="1.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;0" dur="1.5s" begin="1.1s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Divider -->
  <line x1="305" y1="20" x2="305" y2="180" stroke="#6366f1" stroke-width="0.5" opacity="0.2"/>

  <!-- === CENTER: Profile Header (João Baptista / Johnnie88) === -->
  <g text-anchor="middle">
    <text x="468" y="52" font-family="-apple-system,Segoe UI,sans-serif" font-size="23" font-weight="bold" fill="url(#indigoPurple)">
      João Baptista
      <animate attributeName="opacity" values="0;1" dur="1.5s" fill="freeze"/>
    </text>
    <text x="468" y="73" font-family="monospace" font-size="10.5" fill="#8b5cf6" opacity="0.85">
      Alien Build Tech · Cloud &amp; DevOps Specialist
    </text>
    <text x="468" y="93" font-family="monospace" font-size="8.5" fill="#6366f1" opacity="0.65">
      azure · kubernetes · gitops · bicep · sre
    </text>
  </g>

  <!-- === CI/CD Pipeline Stream (below name) === -->
  <g transform="translate(330,110)" opacity="0.75">
    <text x="0" y="-4" font-family="monospace" font-size="7" fill="#6366f1" opacity="0.6">pipeline_stages: code → build → test → sec_audit → deploy</text>
    <g filter="url(#softglow)">
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1">
        <animate attributeName="x" values="-14;0;0" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6">
        <animate attributeName="x" values="-14;28;28" dur="3s" begin="0.3s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.3s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1">
        <animate attributeName="x" values="-14;56;56" dur="3s" begin="0.6s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.6s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6">
        <animate attributeName="x" values="-14;84;84" dur="3s" begin="0.9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="0.9s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1">
        <animate attributeName="x" values="-14;112;112" dur="3s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6">
        <animate attributeName="x" values="-14;140;140" dur="3s" begin="1.5s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.5s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1">
        <animate attributeName="x" values="-14;168;168" dur="3s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6">
        <animate attributeName="x" values="-14;196;196" dur="3s" begin="2.1s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2.1s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#6366f1">
        <animate attributeName="x" values="-14;224;224" dur="3s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </rect>
      <rect x="0" y="0" width="12" height="12" rx="2" fill="#8b5cf6">
        <animate attributeName="x" values="-14;252;252" dur="3s" begin="2.7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;1;1;0" dur="3s" begin="2.7s" repeatCount="indefinite"/>
      </rect>
    </g>
  </g>

  <!-- Divider -->
  <line x1="630" y1="20" x2="630" y2="180" stroke="#8b5cf6" stroke-width="0.5" opacity="0.2"/>

  <!-- === RIGHT-TOP: Cloud & GitOps Status Cards (x: 640-870, y: 15-85) === -->
  <g transform="translate(640,15)">
    <text x="5" y="8" font-family="monospace" font-size="7" fill="#8b5cf6" opacity="0.7">cloud_telemetry</text>
    <!-- Card container -->
    <rect x="0" y="12" width="225" height="68" rx="6" fill="#161b22" stroke="#6366f1" stroke-width="0.5" opacity="0.8"/>

    <!-- Card 1: AKS Production -->
    <g opacity="1">
      <animate attributeName="opacity" values="1;1;0;0;0;0;1" dur="9s" repeatCount="indefinite"/>
      <text x="10" y="30" font-family="monospace" font-size="9" fill="#6366f1" font-weight="bold">aks-prod-cluster</text>
      <text x="10" y="44" font-family="monospace" font-size="7" fill="#8b5cf6" opacity="0.75">nodes: 12 · k8s v1.30 · az-eastus</text>
      <rect x="10" y="50" width="80" height="6" rx="3" fill="#1c2128" stroke="#6366f1" stroke-width="0.3"/>
      <rect x="10" y="50" width="76" height="6" rx="3" fill="#6366f1">
        <animate attributeName="width" values="0;76" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="10" y="68" font-family="monospace" font-size="6.5" fill="#8b5cf6" opacity="0.6">uptime: 99.99% · status: healthy</text>
    </g>

    <!-- Card 2: ArgoCD GitOps -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0;0;0" dur="9s" repeatCount="indefinite"/>
      <text x="10" y="30" font-family="monospace" font-size="9" fill="#8b5cf6" font-weight="bold">argocd-gitops</text>
      <text x="10" y="44" font-family="monospace" font-size="7" fill="#6366f1" opacity="0.75">apps: 24 · clickhouse · sync: auto</text>
      <rect x="10" y="50" width="80" height="6" rx="3" fill="#1c2128" stroke="#8b5cf6" stroke-width="0.3"/>
      <rect x="10" y="50" width="68" height="6" rx="3" fill="#8b5cf6">
        <animate attributeName="width" values="0;68" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="10" y="68" font-family="monospace" font-size="6.5" fill="#6366f1" opacity="0.6">drift: 0 · state: synchronized</text>
    </g>

    <!-- Card 3: Azure DevOps / AZDOPS -->
    <g opacity="0">
      <animate attributeName="opacity" values="0;0;0;0;1;1;0" dur="9s" repeatCount="indefinite"/>
      <text x="10" y="30" font-family="monospace" font-size="9" fill="#6366f1" font-weight="bold">azdops-governance</text>
      <text x="10" y="44" font-family="monospace" font-size="7" fill="#8b5cf6" opacity="0.75">bicep / az-ops · gates: active</text>
      <rect x="10" y="50" width="80" height="6" rx="3" fill="#1c2128" stroke="#6366f1" stroke-width="0.3"/>
      <rect x="10" y="50" width="80" height="6" rx="3" fill="#6366f1">
        <animate attributeName="width" values="0;80" dur="3s" repeatCount="indefinite"/>
      </rect>
      <text x="10" y="68" font-family="monospace" font-size="6.5" fill="#8b5cf6" opacity="0.6">compliance: 100% · security: ok</text>
    </g>
  </g>

  <!-- === RIGHT-BOTTOM: P99 Latency & Throughput Telemetry (x: 640-870, y: 105-185) === -->
  <g transform="translate(640,105)">
    <text x="5" y="8" font-family="monospace" font-size="7" fill="#6366f1" opacity="0.7">p99_latency_ms · throughput</text>
    <rect x="0" y="12" width="225" height="68" rx="6" fill="#161b22" stroke="#8b5cf6" stroke-width="0.5" opacity="0.5"/>
    <!-- Latency curve -->
    <path d="M10,68 Q35,42 60,50 T110,32 Q145,28 175,24 T210,20" fill="none" stroke="#8b5cf6" stroke-width="1.5" opacity="0.85">
      <animate attributeName="stroke-dasharray" values="0,300;300,0" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Latency area fill -->
    <path d="M10,68 Q35,42 60,50 T110,32 Q145,28 175,24 T210,20 L210,80 L10,80 Z" fill="url(#metricGrad)">
      <animate attributeName="opacity" values="0;0.7" dur="4s" repeatCount="indefinite"/>
    </path>
    <!-- Axes -->
    <line x1="10" y1="80" x2="210" y2="80" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    <line x1="10" y1="18" x2="10" y2="80" stroke="#6366f1" stroke-width="0.5" opacity="0.3"/>
    <!-- Moving beacon on curve -->
    <circle r="2.5" fill="#8b5cf6" filter="url(#glow)">
      <animateMotion path="M10,68 Q35,42 60,50 T110,32 Q145,28 175,24 T210,20" dur="4s" repeatCount="indefinite"/>
    </circle>
    <!-- Axis labels -->
    <text x="2" y="20" font-family="monospace" font-size="5" fill="#6366f1" opacity="0.5">p99</text>
    <text x="190" y="78" font-family="monospace" font-size="5" fill="#8b5cf6" opacity="0.5">req/s</text>
  </g>

  <!-- Blinking status indicator -->
  <rect x="858" y="188" width="10" height="2" fill="#8b5cf6">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
