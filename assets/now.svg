      <rect x="0" y="6" width="440" height="7" rx="3.5" fill="#111827" stroke="#374151" stroke-width="0.5"/>
      <rect x="0" y="6" width="370" height="7" rx="3.5" fill="url(#purplePink)" filter="url(#subtleGlow)">
        <animate attributeName="width" values="350;385;370" dur="5s" repeatCount="indefinite"/>
