<svg xmlns="http://www.w3.org/2000/svg" width="480" height="780" viewBox="0 0 480 780">
  <defs>
    <!-- Background Gradient: Deep Cyber Obsidian -->
    <linearGradient id="termBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0b0f19"/>
      <stop offset="50%" stop-color="#080c14"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>

    <!-- Header Gradient -->
    <linearGradient id="headerGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1f2937"/>
    </linearGradient>

    <!-- Neon Accent Gradients -->
    <linearGradient id="cyanNeon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="purplePink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="amberGold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="greenTeal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <!-- Soft Glow Filter -->
    <filter id="glow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="subtleGlow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Window Shadow / Glow Border -->
  <rect x="2" y="2" width="476" height="776" rx="12" fill="none" stroke="#06b6d4" stroke-width="1.2" opacity="0.6"/>
  <rect x="5" y="5" width="470" height="770" rx="10" fill="url(#termBg)" stroke="#1f2937" stroke-width="1"/>

  <!-- Subtle CRT Scanlines -->
  <g opacity="0.04" stroke="#06b6d4" stroke-width="0.6">
    <line x1="5" y1="60" x2="475" y2="60"/>
    <line x1="5" y1="120" x2="475" y2="120"/>
    <line x1="5" y1="180" x2="475" y2="180"/>
    <line x1="5" y1="240" x2="475" y2="240"/>
    <line x1="5" y1="300" x2="475" y2="300"/>
    <line x1="5" y1="360" x2="475" y2="360"/>
    <line x1="5" y1="420" x2="475" y2="420"/>
    <line x1="5" y1="480" x2="475" y2="480"/>
    <line x1="5" y1="540" x2="475" y2="540"/>
    <line x1="5" y1="600" x2="475" y2="600"/>
    <line x1="5" y1="660" x2="475" y2="660"/>
    <line x1="5" y1="720" x2="475" y2="720"/>
  </g>

  <!-- Terminal Window Titlebar -->
  <path d="M 5,15 Q 5,5 15,5 L 465,5 Q 475,5 475,15 L 475,38 L 5,38 Z" fill="url(#headerGrad)"/>
  <line x1="5" y1="38" x2="475" y2="38" stroke="#374151" stroke-width="0.8"/>

  <!-- Window Buttons -->
  <circle cx="24" cy="22" r="5" fill="#ef4444" opacity="0.9"/>
  <circle cx="40" cy="22" r="5" fill="#f59e0b" opacity="0.9"/>
  <circle cx="56" cy="22" r="5" fill="#10b981" opacity="0.9"/>

  <!-- Window Title -->
  <text x="240" y="25" text-anchor="middle" font-family="'SF Mono', 'JetBrains Mono', 'Fira Code', monospace" font-size="11" fill="#9ca3af">
    johnnie88@alien-build-box: ~ (pwsh/bash)
  </text>

  <!-- Live Pulse Beacon Top Right -->
