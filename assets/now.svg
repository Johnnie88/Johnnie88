        <animate attributeName="opacity" values="0.6;1;0.6" dur="1.8s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- Info Lines -->
    <g transform="translate(56, 18)" font-family="monospace" font-size="10.5">
      <text x="0" y="0" fill="#93c5fd" font-weight="bold">USER:</text>
      <text x="65" y="0" fill="#f8fafc">João Baptista (Johnnie88)</text>

      <text x="0" y="16" fill="#93c5fd" font-weight="bold">ROLE:</text>
      <text x="65" y="16" fill="#a78bfa">Founder &amp; Cloud/DevOps Architect</text>

      <text x="0" y="32" fill="#93c5fd" font-weight="bold">COMPANY:</text>
      <text x="65" y="32" fill="#34d399">Alien Build Tech</text>

