    <text x="14" y="0" font-family="monospace" font-size="11" fill="#06b6d4">k8s</text>
    <text x="42" y="0" font-family="monospace" font-size="11" font-weight="bold" fill="#f3f4f6">kubectl get services,gitops -n prod</text>

    <!-- Table Header -->
    <g transform="translate(0, 18)" font-family="monospace" font-size="9" fill="#6b7280" font-weight="bold">
      <text x="0" y="0">SERVICE / WORKLOAD</text>
      <text x="175" y="0">STATUS</text>
      <text x="260" y="0">GITOPS</text>
      <text x="350" y="0">LATENCY</text>
    </g>

    <!-- Row 1: ArgoCD ClickHouse -->
    <g transform="translate(0, 36)" font-family="monospace" font-size="10">
      <text x="0" y="0" fill="#38bdf8">argocd-clickhouse</text>
      <!-- Status Badge -->
