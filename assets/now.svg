        <text x="12" y="108" fill="#6b7280">[23:49:18]</text>
        <text x="80" y="108" fill="#34d399" font-weight="bold">[DEPLOY]</text>
        <text x="140" y="108" fill="#e2e8f0">Alien Build TUI &amp; services healthy</text>
        <text x="415" y="108" fill="#38bdf8" text-anchor="end">100%</text>
      </g>

