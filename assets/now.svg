        <text x="12" y="86" fill="#6b7280">[23:49:16]</text>
        <text x="80" y="86" fill="#fbbf24" font-weight="bold">[AZOPS]</text>
        <text x="140" y="86" fill="#e2e8f0">Landing zone governance policies enforced</text>
        <text x="415" y="86" fill="#34d399" text-anchor="end">✓ ACTIVE</text>
