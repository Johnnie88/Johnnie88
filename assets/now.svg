<svg xmlns="http://www.w3.org/2000/svg" width="880" height="48" viewBox="0 0 880 48">
  <defs>
    <linearGradient id="nowbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#07100b"/>
      <stop offset="50%" stop-color="#0d1813"/>
      <stop offset="100%" stop-color="#0a140f"/>
    </linearGradient>
    <filter id="termGlow">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="880" height="48" rx="7" fill="url(#nowbg)" stroke="#22c55e" stroke-width="0.8" opacity="0.95"/>

  <!-- Terminal Window Controls / Indicator Dots -->
  <circle cx="18" cy="24" r="3.5" fill="#ef4444" opacity="0.75"/>
  <circle cx="30" cy="24" r="3.5" fill="#eab308" opacity="0.75"/>
  <circle cx="42" cy="24" r="3.5" fill="#22c55e" opacity="0.85"/>

  <!-- Terminal Prompt -->
  <text x="62" y="28" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="11.5" font-weight="bold" fill="#4ade80" filter="url(#termGlow)">johnnie88@alien-build:~$</text>

  <!-- Tagline 1 (Terminal Phosphor Green) -->
  <text x="245" y="28" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="11.5" fill="#22c55e" filter="url(#termGlow)">
    Architecting scalable cloud infrastructure &amp; automated GitOps pipelines.
    <animate attributeName="opacity" values="1;1;0;0;0;0;0;0;1" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline 2 (Bright Mint / Terminal Matrix Green) -->
  <text x="245" y="28" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="11.5" fill="#00ff66" filter="url(#termGlow)">
    Automating Azure, Kubernetes, and enterprise CI/CD workflows.
    <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Tagline 3 (Neon Emerald Green) -->
  <text x="245" y="28" font-family="'SF Mono', 'Fira Code', 'JetBrains Mono', monospace" font-size="11.5" fill="#34d399" filter="url(#termGlow)">
    Infrastructure as Code: reliable, reproducible, and production-tested.
    <animate attributeName="opacity" values="0;0;0;0;1;1;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
  </text>

  <!-- Terminal Blinking Cursor -->
  <rect x="856" y="16" width="9" height="16" fill="#00ff66" filter="url(#termGlow)">
    <animate attributeName="opacity" values="1;1;0;0" keyTimes="0;0.5;0.5;1" dur="1s" repeatCount="indefinite"/>
  </rect>
</svg>
