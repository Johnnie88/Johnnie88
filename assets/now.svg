      <circle cx="178" cy="-2.5" r="2.5" fill="#10b981">
        <animate attributeName="opacity" values="1;0.4;1" dur="1.2s" repeatCount="indefinite"/>
      </circle>
      <text x="186" y="0.5" font-size="8.5" fill="#a7f3d0" font-weight="bold">READY</text>
      <text x="260" y="0" fill="#34d399">Synced 100%</text>
      <text x="350" y="0" fill="#93c5fd">8.4ms</text>
