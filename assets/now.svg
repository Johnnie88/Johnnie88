      <text x="400" y="0" text-anchor="end" font-family="monospace" font-size="9.5" font-weight="bold" fill="#38bdf8">100% PASS</text>
      <rect x="0" y="6" width="440" height="7" rx="3.5" fill="#111827" stroke="#374151" stroke-width="0.5"/>
      <rect x="0" y="6" width="440" height="7" rx="3.5" fill="url(#cyanNeon)" filter="url(#subtleGlow)">
