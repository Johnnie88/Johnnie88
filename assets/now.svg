      </text>
      <text x="60" y="0" font-family="monospace" font-size="9.5" fill="#c084fc">
        Automating Azure, Kubernetes, and enterprise CI/CD workflows.
        <animate attributeName="opacity" values="0;0;1;1;0;0;0;0;0" keyTimes="0;0.3;0.33;0.63;0.66;0.96;0.97;0.99;1" dur="15s" repeatCount="indefinite"/>
